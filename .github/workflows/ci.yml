name: CI

# GitHub-hosted runners (ubuntu-latest). Free with unlimited minutes because this
# repo is public. No deploy here — void-server pulls and redeploys itself
# (see deploy/ and README "Deploy").

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Verify migrations are up to date
        run: |
          dotnet tool restore
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project src/Foodprint.Core --startup-project src/Foodprint.Cli

      - name: Install Playwright browsers
        run: pwsh tests/Foodprint.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      # Native amd64 build — a fast Dockerfile sanity check. void-server does the
      # real linux/arm64 build at deploy time.
      - name: Build image
        run: docker build -t foodprint:ci .
