# Foodprint on void-server (Raspberry Pi, linux/arm64).
# Same pattern as the other apps there: build locally, join the external `proxy`
# network, let Traefik terminate TLS and route foodprint.northernarchive.com.

services:
  foodprint:
    build:
      context: .
    image: foodprint:latest
    container_name: foodprint
    restart: unless-stopped
    environment:
      Foodprint__AdminEmail: pasta0126@gmail.com
      Foodprint__PublicBaseUrl: https://foodprint.northernarchive.com
      Foodprint__AllowSelfRegistration: "false"
      Foodprint__DefaultTimeZone: Europe/Madrid
      ForwardedHeaders__Enabled: "true"
    volumes:
      - foodprint-data:/data     # SQLite database — back this up (see README)
      - foodprint-keys:/keys     # Data Protection keys — losing these signs everyone out
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.foodprint.rule=Host(`foodprint.northernarchive.com`)"
      - "traefik.http.routers.foodprint.entrypoints=websecure"
      - "traefik.http.routers.foodprint.tls.certresolver=le"
      - "traefik.http.services.foodprint.loadbalancer.server.port=8080"

networks:
  proxy:
    external: true

volumes:
  foodprint-data:
  foodprint-keys:
